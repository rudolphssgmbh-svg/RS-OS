services:
  postgres:
    image: postgres:16
    container_name: rsos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rsos
      POSTGRES_PASSWORD: rsos_secure_2026
      POSTGRES_DB: rsos_runtime
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./storage/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: rsos-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

  runtime-api:
    build: ./runtime-api
    container_name: rsos-runtime-api
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      DB_HOST: rsos-postgres
      DB_USER: rsos
      DB_PASSWORD: rsos_secure_2026
      DB_NAME: rsos_runtime
      JWT_SECRET: RSOS_SECURE_RUNTIME_2026
    ports:
      - "127.0.0.1:8080:8080"

  runtime-api-recovery:
    build: ./runtime-api
    container_name: rsos-runtime-api-recovery
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      DB_HOST: rsos-postgres
      DB_USER: rsos
      DB_PASSWORD: rsos_secure_2026
      DB_NAME: rsos_runtime
      JWT_SECRET: RSOS_SECURE_RUNTIME_2026

  registry-server:
    build: ./registry-server
    container_name: rsos-registry-server
    restart: unless-stopped
    environment:
      RSOS_REGISTRY_HOST: 0.0.0.0
      RSOS_REGISTRY_PORT: 8090
      RSOS_REGISTRY_BASE_DIR: /app
      RSOS_REGISTRY_DATA_DIR: /data
      RSOS_REGISTRY_USER: admin
      RSOS_REGISTRY_PASSWORD: RSOS-2026-SECURE
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./registry-server/data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://admin:RSOS-2026-SECURE@127.0.0.1:8090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
