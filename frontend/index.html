<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>RS OS Tenant Control Center</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #111827;
      margin: 0;
      padding: 24px;
    }
    h1, h2, h3 { margin-top: 0; }
    input, select {
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      margin: 4px;
      min-width: 240px;
    }
    button {
      background: #111827;
      color: white;
      border: 0;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      margin: 4px;
    }
    button.secondary { background: #374151; }
    button.danger { background: #991b1b; }
    .card {
      background: white;
      padding: 16px;
      border-radius: 12px;
      margin: 14px 0;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
      gap: 14px;
    }
    .metric {
      background: #f9fafb;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
    }
    .metric strong {
      display: block;
      font-size: 24px;
      margin-top: 6px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      background: white;
    }
    th, td {
      text-align: left;
      border-bottom: 1px solid #e5e7eb;
      padding: 8px;
      vertical-align: top;
    }
    tr:hover { background: #f9fafb; }
    pre {
      background: #111827;
      color: #d1d5db;
      padding: 14px;
      border-radius: 8px;
      overflow: auto;
      max-height: 420px;
    }
    .ok { color: green; font-weight: bold; }
    .bad { color: #b91c1c; font-weight: bold; }
    .muted { color: #6b7280; }
  </style>
</head>
<body>

<h1>RS OS Tenant Control Center</h1>
<p class="muted">Verwaltungsportal für Tenants, Mitglieder, Credentials und Runtime-Status.</p>

<div class="card">
  <h2>Login</h2>
  <input id="username" value="janette" placeholder="Benutzername">
  <input id="password" type="password" value="rsos_secure_2026" placeholder="Passwort">
  <button onclick="login()">Login</button>
  <button class="secondary" onclick="logout()">Logout</button>
  <p id="authState" class="bad">Nicht angemeldet</p>
</div>

<div class="card">
  <h2>Aktionen</h2>
  <button onclick="loadDashboard()">Global Dashboard</button>
  <button onclick="loadTenants()">Tenants laden</button>
</div>

<div class="card">
  <h2>Global Dashboard</h2>
  <div id="summaryGrid" class="grid"></div>
</div>

<div class="card">
  <h2>Tenants</h2>
  <div id="tenantTable"></div>
</div>

<div class="card">
  <h2>Tenant Detail</h2>
  <input id="tenantDetailId" placeholder="tenant_id">
  <button onclick="loadTenantDetail()">Tenant Detail laden</button>
  <div id="tenantDetail"></div>
</div>

<div class="card">
  <h2>Tenant anlegen</h2>
  <input id="newTenantId" placeholder="tenant-demo">
  <input id="newTenantName" placeholder="Demo GmbH">
  <input id="newTenantType" placeholder="demo">
  <input id="newOwnerName" placeholder="Owner Name">
  <input id="newOwnerEmail" placeholder="owner@example.de">
  <input id="newDomainName" placeholder="demo.example.de">
  <button onclick="createTenant()">Tenant erstellen</button>
</div>

<div class="card">
  <h2>Member anlegen</h2>
  <input id="memberTenantId" placeholder="tenant_id">
  <input id="memberUsername" placeholder="username">
  <input id="memberDisplayName" placeholder="Display Name">
  <input id="memberEmail" placeholder="email@example.de">
  <select id="memberRole">
    <option value="tenant_admin">tenant_admin</option>
    <option value="operator">operator</option>
    <option value="auditor">auditor</option>
  </select>
  <button onclick="createMember()">Member erstellen</button>
</div>

<div class="card">
  <h2>Credential anlegen</h2>
  <input id="credentialTenantId" placeholder="tenant_id">
  <input id="credentialUsername" placeholder="username">
  <input id="credentialPassword" type="password" value="rsos_secure_2026" placeholder="Passwort">
  <select id="credentialScope">
    <option value="tenant">tenant</option>
  </select>
  <button onclick="createCredential()">Credential erstellen</button>
</div>

<div class="card">
  <h2>Antwort / Debug</h2>
  <pre id="output">{}</pre>
</div>

<script>
const API_BASE = "";
let token = localStorage.getItem("rsos_token") || null;

function setOutput(data) {
  document.getElementById("output").textContent = JSON.stringify(data, null, 2);
}

function setAuthState(operator) {
  const el = document.getElementById("authState");
  if (!token) {
    el.textContent = "Nicht angemeldet";
    el.className = "bad";
    return;
  }
  el.textContent = operator
    ? `Angemeldet: ${operator.operator_id} | ${operator.role} | ${operator.scope}`
    : "Angemeldet";
  el.className = "ok";
}

async function api(path, options = {}) {
  const headers = options.headers || {};
  if (token) headers["Authorization"] = "Bearer " + token;
  if (options.body && !headers["Content-Type"]) {
    headers["Content-Type"] = "application/json";
  }

  const res = await fetch(API_BASE + path, {
    ...options,
    headers
  });

  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    throw data;
  }
  return data;
}

async function login() {
  try {
    const data = await api("/auth/login", {
      method: "POST",
      body: JSON.stringify({
        username: document.getElementById("username").value,
        password: document.getElementById("password").value
      })
    });

    token = data.token;
    localStorage.setItem("rsos_token", token);
    setAuthState(data.operator);
    setOutput(data);
    await loadDashboard();
    await loadTenants();
  } catch (err) {
    setOutput(err);
    token = null;
    localStorage.removeItem("rsos_token");
    setAuthState();
  }
}

function logout() {
  token = null;
  localStorage.removeItem("rsos_token");
  setAuthState();
  setOutput({ logged_out: true });
}

async function loadDashboard() {
  try {
    const data = await api("/runtime/admin/dashboard");
    renderSummary(data.summary);
    setOutput(data);
  } catch (err) {
    setOutput(err);
  }
}

function renderSummary(summary) {
  const grid = document.getElementById("summaryGrid");
  if (!summary) {
    grid.innerHTML = "";
    return;
  }

  const labels = {
    tenant_count: "Tenants",
    member_count: "Members",
    credential_count: "Credentials",
    object_count: "Objects",
    recommendation_count: "Recommendations",
    training_plan_count: "Training Plans",
    learning_evidence_count: "Learning Evidence",
    risk_count: "Risks",
    governance_decision_count: "Governance",
    communication_event_count: "Communication",
    audit_event_count: "Audit Events"
  };

  grid.innerHTML = Object.entries(labels).map(([key, label]) => `
    <div class="metric">
      ${label}
      <strong>${summary[key] ?? 0}</strong>
    </div>
  `).join("");
}

async function loadTenants() {
  try {
    const data = await api("/runtime/admin/tenants");
    renderTenants(data.tenants || []);
    setOutput(data);
  } catch (err) {
    setOutput(err);
  }
}

function renderTenants(tenants) {
  const container = document.getElementById("tenantTable");
  if (!tenants.length) {
    container.innerHTML = "<p>Keine Tenants gefunden.</p>";
    return;
  }

  container.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Tenant</th>
          <th>Typ</th>
          <th>Status</th>
          <th>Members</th>
          <th>Credentials</th>
          <th>Recommendations</th>
          <th>Training</th>
          <th>Aktion</th>
        </tr>
      </thead>
      <tbody>
        ${tenants.map(t => `
          <tr>
            <td><strong>${t.tenant_name}</strong><br><span class="muted">${t.tenant_id}</span></td>
            <td>${t.tenant_type || ""}</td>
            <td>${t.status || ""}</td>
            <td>${t.members ?? 0}</td>
            <td>${t.credentials ?? 0}</td>
            <td>${t.recommendations ?? 0}</td>
            <td>${t.training_plans ?? 0}</td>
            <td><button onclick="selectTenant('${t.tenant_id}')">Öffnen</button></td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  `;
}

function selectTenant(tenantId) {
  document.getElementById("tenantDetailId").value = tenantId;
  document.getElementById("memberTenantId").value = tenantId;
  document.getElementById("credentialTenantId").value = tenantId;
  loadTenantDetail();
}

async function loadTenantDetail() {
  try {
    const tenantId = document.getElementById("tenantDetailId").value;
    const data = await api("/runtime/admin/tenants/" + encodeURIComponent(tenantId));
    renderTenantDetail(data);
    setOutput(data);
  } catch (err) {
    setOutput(err);
  }
}

function renderTenantDetail(data) {
  const el = document.getElementById("tenantDetail");
  if (!data || !data.tenant) {
    el.innerHTML = "";
    return;
  }

  const tenant = data.tenant;
  const stats = data.statistics || {};
  const learning = data.learning || {};

  el.innerHTML = `
    <div class="card" style="box-shadow:none;border:1px solid #e5e7eb;">
      <h3>${tenant.tenant_name}</h3>
      <p class="muted">
        ${tenant.tenant_id} | ${tenant.tenant_type} | ${tenant.status}
      </p>

      <div class="grid">
        <div class="metric">Domains<strong>${data.domains?.count ?? 0}</strong></div>
        <div class="metric">Members<strong>${data.members?.count ?? 0}</strong></div>
        <div class="metric">Credentials<strong>${data.credentials?.count ?? 0}</strong></div>
        <div class="metric">Objects<strong>${stats.objects ?? 0}</strong></div>
        <div class="metric">Recommendations<strong>${stats.recommendations ?? 0}</strong></div>
        <div class="metric">Training Plans<strong>${stats.training_plans ?? 0}</strong></div>
        <div class="metric">Learning Evidence<strong>${stats.learning_evidence ?? 0}</strong></div>
        <div class="metric">Risks<strong>${stats.risks ?? 0}</strong></div>
      </div>

      <h3>Learning</h3>
      <div class="grid">
        <div class="metric">Competencies<strong>${learning.competencies ?? 0}</strong></div>
        <div class="metric">Open Gaps<strong>${learning.open_gaps ?? 0}</strong></div>
        <div class="metric">Critical Gaps<strong>${learning.critical_gaps ?? 0}</strong></div>
        <div class="metric">Total Gap<strong>${learning.total_gap ?? 0}</strong></div>
        <div class="metric">Gap Reduction<strong>${learning.total_gap_reduction ?? 0}</strong></div>
        <div class="metric">Effectiveness<strong>${learning.effectiveness_score ?? 0}%</strong></div>
      </div>

      <h3>Domains</h3>
      <table>
        <thead><tr><th>Domain</th><th>Role</th><th>Status</th><th>Created</th></tr></thead>
        <tbody>
          ${(data.domains?.items || []).map(d => `
            <tr>
              <td>${d.domain_name}</td>
              <td>${d.domain_role}</td>
              <td>${d.status}</td>
              <td>${d.created_at || ""}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>

      <h3>Members</h3>
      <table>
        <thead><tr><th>User</th><th>Name</th><th>Email</th><th>Role</th><th>Status</th></tr></thead>
        <tbody>
          ${(data.members?.items || []).map(m => `
            <tr>
              <td>${m.username}</td>
              <td>${m.display_name || ""}</td>
              <td>${m.email || ""}</td>
              <td>${m.role}</td>
              <td>${m.status}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>

      <h3>Credentials</h3>
      <table>
        <thead><tr><th>User</th><th>Status</th><th>Scope</th><th>System Role</th></tr></thead>
        <tbody>
          ${(data.credentials?.items || []).map(c => `
            <tr>
              <td>${c.username}</td>
              <td>${c.status}</td>
              <td>${c.scope}</td>
              <td>${c.system_role || ""}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
}


async function createTenant() {
  try {
    const data = await api("/runtime/admin/tenants", {
      method: "POST",
      body: JSON.stringify({
        tenant_id: document.getElementById("newTenantId").value,
        tenant_name: document.getElementById("newTenantName").value,
        tenant_type: document.getElementById("newTenantType").value || "business",
        owner_name: document.getElementById("newOwnerName").value,
        owner_email: document.getElementById("newOwnerEmail").value,
        domain_name: document.getElementById("newDomainName").value
      })
    });
    setOutput(data);
    await loadTenants();
  } catch (err) {
    setOutput(err);
  }
}

async function createMember() {
  try {
    const tenantId = document.getElementById("memberTenantId").value;
    const data = await api("/runtime/admin/tenants/" + encodeURIComponent(tenantId) + "/members", {
      method: "POST",
      body: JSON.stringify({
        username: document.getElementById("memberUsername").value,
        display_name: document.getElementById("memberDisplayName").value,
        email: document.getElementById("memberEmail").value,
        role: document.getElementById("memberRole").value
      })
    });
    setOutput(data);
    await loadTenantDetail();
  } catch (err) {
    setOutput(err);
  }
}

async function createCredential() {
  try {
    const tenantId = document.getElementById("credentialTenantId").value;
    const data = await api("/runtime/admin/tenants/" + encodeURIComponent(tenantId) + "/credentials", {
      method: "POST",
      body: JSON.stringify({
        username: document.getElementById("credentialUsername").value,
        password: document.getElementById("credentialPassword").value,
        scope: document.getElementById("credentialScope").value
      })
    });
    setOutput(data);
    await loadTenantDetail();
  } catch (err) {
    setOutput(err);
  }
}

setAuthState();
</script>

</body>
</html>
